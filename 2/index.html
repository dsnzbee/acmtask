<!DOCTYPE html>
<html>
<head>
    <title>Dice Roller and Password Generator</title>
</head>
<body>

    <h2>Dice Roller</h2>
    <label for="numOfDice">Number of dice:</label>
    <input type="number" id="numOfDice" value="1" min="1">
    <button id="rollBtn">Roll Dice</button>
    <p id="diceResult"></p>
    <div id="diceImages"></div>

    <h2>Password Generator</h2>
    <label for="passwordLength">Length:</label>
    <input type="number" id="passwordLength" value="12">
    <br>
    <input type="checkbox" id="includeLower" checked>
    <label for="includeLower">Lowercase</label>
    <br>
    <input type="checkbox" id="includeUpper" checked>
    <label for="includeUpper">Uppercase</label>
    <br>
    <input type="checkbox" id="includeNumbers" checked>
    <label for="includeNumbers">Numbers</label>
    <br>
    <input type="checkbox" id="includeSymbols" checked>
    <label for="includeSymbols">Symbols</label>
    <br>
    <button id="generateBtn">Generate Password</button>
    <p id="passwordResult"></p>

    <script src="script.js"></script>
</body>
</html>
